name: 🐛 Bug report
description: A skill is broken, misbehaving, or producing wrong results. Include reproduction steps and logs.
title: "[Bug] "
labels: ["type: bug", "area: skills"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this template when a skill you installed isn't working as expected. For security issues, use the **Security report** template instead — security issues MUST NOT be filed publicly.

  - type: input
    id: skill_name
    attributes:
      label: Which skill is affected?
      description: The exact skill name (the folder name in the registry). Case-sensitive.
      placeholder: fractal
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Skill version
      description: The `version` field from the skill's `.fractal/manifest.json`. If unknown, write `unknown`.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How broken is it?
      options:
        - "Low — cosmetic, workaround exists"
        - "Medium — broken feature, has workaround"
        - "High — broken feature, no workaround"
        - "Critical — data loss, security, or breaks the app"
      default: 1

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Clear description of the bug. What did you observe?
      placeholder: |
        I installed `fractal` and ran `fractal memories list`. The command exits with code 0 but returns an empty array, even though I have memories in `~/.fractal/memories`.
    validations:
      required: true
      min_length: 30

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: |
        I expected `fractal memories list` to return the list of memories I created in previous sessions.
    validations:
      required: true
      min_length: 10

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ordered list, including any commands you ran.
      placeholder: |
        1. Install the skill: `fractal skills install fractal`
        2. Create a memory: `fractal memories create --title "test"`
        3. List memories: `fractal memories list`
        4. See empty array.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or error output
      description: Paste the relevant portion of `~/.fractal/logs/*.log` or attach a screenshot.
      placeholder: |
        ```
        [ERROR] Failed to read memory store: ENOENT: no such file or directory
          at MemoryStore.read (file:///src/features/memory/procedures/list.procedure.ts:42:11)
        ```
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Fractal version, Node/Bun version, install method.
      placeholder: |
        - OS: macOS 15.4
        - Fractal CLI: 0.1.314
        - Bun: 1.3.2
        - Install method: `npm i -g @fractal-os/cli`
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: "I searched [existing issues](https://github.com/tryfractal/registry/issues?q=is%3Aissue) and didn't find a duplicate"
        - label: "I'm not reporting a security issue (security reports go to the Security disclosure tab)"
        - label: "I can reproduce this on the latest version of the skill"
